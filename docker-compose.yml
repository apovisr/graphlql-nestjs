name: biblioteca-graphql

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-biblioteca}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-biblioteca}
      POSTGRES_DB: ${DB_NAME:-biblioteca}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

  # Cliente web para inspeccionar las tablas: http://localhost:8080
  # (Sistema: PostgreSQL, Servidor: postgres, credenciales las de arriba)
  adminer:
    image: adminer:latest
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
